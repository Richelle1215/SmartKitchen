services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartkitchen-app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - mysql


  nginx:
    image: nginx:alpine

    container_name: smartkitchen-nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app


  mysql:
    image: mysql:8.0

    container_name: smartkitchen-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: smartkitchen
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: smartkitchen
      MYSQL_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: